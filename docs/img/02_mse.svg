<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="Fitness: error cuadrático medio, fila por fila">
<title>Fitness: error cuadrático medio, fila por fila</title>
<style>
text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.bg { fill: #fcfcfb; }
.card { fill: #f4f3ef; stroke: #e2e1dc; }
.t { fill: #0b0b0b; }
.t2 { fill: #52514e; }
.t3 { fill: #7a7974; }
.edge { stroke: #9b9a94; stroke-width: 2; fill: none; }
.edge2 { stroke: #c9c8c2; stroke-width: 2; fill: none; }
.grid { stroke: #e6e5e0; stroke-width: 1; }
.axis { stroke: #b9b8b2; stroke-width: 1; }
.op { fill: #6366f1; } .opt { fill: #ffffff; }
.var { fill: #3fb874; } .vart { fill: #08321b; }
.cst { fill: #d3d4de; } .cstt { fill: #23242a; }
.fold { fill: #f6c445; } .foldt { fill: #3a2a00; }
.s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
.s1s { stroke: #2a78d6; } .s2s { stroke: #eb6834; } .s3s { stroke: #1baf7a; }
.o1 { fill: #86b6ef; } .o2 { fill: #2a78d6; } .o3 { fill: #184f95; }
.ring { fill: none; stroke-width: 3; }
.dash { fill: none; stroke-width: 2; stroke-dasharray: 6 5; }
.hl { fill: #eb6834; fill-opacity: 0.10; stroke: #eb6834; stroke-width: 2; stroke-dasharray: 6 5; }
.hlb { fill: #2a78d6; fill-opacity: 0.08; stroke: #2a78d6; stroke-width: 2; stroke-dasharray: 6 5; }
.good { fill: #0ca30c; } .bad { fill: #d03b3b; }
.goods { stroke: #0ca30c; } .bads { stroke: #d03b3b; }
.cell { fill: #ffffff; stroke: #cfcec8; }
.arrow { stroke: #7a7974; stroke-width: 2; fill: none; marker-end: url(#ah); }
.ah { fill: #7a7974; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; }
  .card { fill: #242423; stroke: #3a3a37; }
  .t { fill: #f0efec; }
  .t2 { fill: #c3c2b7; }
  .t3 { fill: #9d9c95; }
  .edge { stroke: #8f8e88; }
  .edge2 { stroke: #4a4a46; }
  .grid { stroke: #2f2f2d; }
  .axis { stroke: #55554f; }
  .op { fill: #7c7ff5; }
  .var { fill: #2f9e63; } .vart { fill: #ecfff3; }
  .cst { fill: #55565f; } .cstt { fill: #f2f2f6; }
  .fold { fill: #c99a1c; } .foldt { fill: #1d1500; }
  .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
  .s1s { stroke: #3987e5; } .s2s { stroke: #d95926; } .s3s { stroke: #199e70; }
  .o1 { fill: #184f95; } .o2 { fill: #3987e5; } .o3 { fill: #86b6ef; }
  .hl { fill: #d95926; stroke: #d95926; }
  .hlb { fill: #3987e5; stroke: #3987e5; }
  .cell { fill: #20201f; stroke: #45453f; }
  .arrow { stroke: #9d9c95; }
  .ah { fill: #9d9c95; }
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect width="880" height="400" rx="14" class="bg"/>
<text x="28.0" y="38.0" class="t" font-size="19" text-anchor="start" font-weight="700" >Fitness = MSE, evaluando fila por fila</text>
<text x="28.0" y="60.0" class="t2" font-size="13" text-anchor="start" font-weight="normal" >Ejemplo del manual: el árbol (x1 + x2 × 0.5) contra 3 filas de datos.</text>
<line x1="104.5" y1="120.0" x2="70.0" y2="180.0" class="edge" />
<line x1="104.5" y1="120.0" x2="139.0" y2="180.0" class="edge" />
<line x1="139.0" y1="180.0" x2="116.0" y2="240.0" class="edge" />
<line x1="139.0" y1="180.0" x2="162.0" y2="240.0" class="edge" />
<circle cx="104.5" cy="120.0" r="17" class="op"/>
<text x="104.5" y="125.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >+</text>
<circle cx="70.0" cy="180.0" r="17" class="var"/>
<text x="70.0" y="184.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x1</text>
<circle cx="139.0" cy="180.0" r="17" class="op"/>
<text x="139.0" y="185.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >×</text>
<circle cx="116.0" cy="240.0" r="17" class="var"/>
<text x="116.0" y="244.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x2</text>
<circle cx="162.0" cy="240.0" r="17" class="cst"/>
<text x="162.0" y="244.7" class="cstt" font-size="13" text-anchor="middle" font-weight="500" >0.5</text>
<text x="276.0" y="100.0" class="t2" font-size="12.5" text-anchor="middle" font-weight="600" >x1</text>
<text x="328.0" y="100.0" class="t2" font-size="12.5" text-anchor="middle" font-weight="600" >x2</text>
<text x="380.0" y="100.0" class="t2" font-size="12.5" text-anchor="middle" font-weight="600" >x3</text>
<text x="432.0" y="100.0" class="t2" font-size="12.5" text-anchor="middle" font-weight="600" >y</text>
<text x="543.0" y="100.0" class="t2" font-size="12.5" text-anchor="middle" font-weight="600" >ŷ = árbol(fila)</text>
<text x="674.0" y="100.0" class="t2" font-size="12.5" text-anchor="middle" font-weight="600" >(y − ŷ)²</text>
<rect x="252.0" y="116.0" width="48.0" height="32.0" rx="6" class="cell" />
<text x="276.0" y="137.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >1.0</text>
<rect x="304.0" y="116.0" width="48.0" height="32.0" rx="6" class="cell" />
<text x="328.0" y="137.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >2.0</text>
<rect x="356.0" y="116.0" width="48.0" height="32.0" rx="6" class="cell" />
<text x="380.0" y="137.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >0.0</text>
<rect x="408.0" y="116.0" width="48.0" height="32.0" rx="6" class="cell" />
<text x="432.0" y="137.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >2.5</text>
<rect x="460.0" y="116.0" width="166.0" height="32.0" rx="6" class="cell" />
<text x="543.0" y="137.0" class="t" font-size="12.5" text-anchor="middle" font-weight="normal" >1 + 2×0.5 = 2.0</text>
<rect x="630.0" y="116.0" width="88.0" height="32.0" rx="6" class="cell" />
<text x="674.0" y="137.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >0.25</text>
<rect x="252.0" y="156.0" width="48.0" height="32.0" rx="6" class="cell" />
<text x="276.0" y="177.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >0.0</text>
<rect x="304.0" y="156.0" width="48.0" height="32.0" rx="6" class="cell" />
<text x="328.0" y="177.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >1.0</text>
<rect x="356.0" y="156.0" width="48.0" height="32.0" rx="6" class="cell" />
<text x="380.0" y="177.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >1.0</text>
<rect x="408.0" y="156.0" width="48.0" height="32.0" rx="6" class="cell" />
<text x="432.0" y="177.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >1.0</text>
<rect x="460.0" y="156.0" width="166.0" height="32.0" rx="6" class="cell" />
<text x="543.0" y="177.0" class="t" font-size="12.5" text-anchor="middle" font-weight="normal" >0 + 1×0.5 = 0.5</text>
<rect x="630.0" y="156.0" width="88.0" height="32.0" rx="6" class="cell" />
<text x="674.0" y="177.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >0.25</text>
<rect x="252.0" y="196.0" width="48.0" height="32.0" rx="6" class="cell" />
<text x="276.0" y="217.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >2.0</text>
<rect x="304.0" y="196.0" width="48.0" height="32.0" rx="6" class="cell" />
<text x="328.0" y="217.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >0.5</text>
<rect x="356.0" y="196.0" width="48.0" height="32.0" rx="6" class="cell" />
<text x="380.0" y="217.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >1.0</text>
<rect x="408.0" y="196.0" width="48.0" height="32.0" rx="6" class="cell" />
<text x="432.0" y="217.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >3.5</text>
<rect x="460.0" y="196.0" width="166.0" height="32.0" rx="6" class="cell" />
<text x="543.0" y="217.0" class="t" font-size="12.5" text-anchor="middle" font-weight="normal" >2 + 0.5×0.5 = 2.25</text>
<rect x="630.0" y="196.0" width="88.0" height="32.0" rx="6" class="cell" />
<text x="674.0" y="217.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >1.5625</text>
<line x1="200.0" y1="160.0" x2="245.0" y2="160.0" class="arrow" />
<text x="250.0" y="268.0" class="t" font-size="15" text-anchor="start" font-weight="700" >MSE = (0.25 + 0.25 + 1.5625) / 3 = 0.6875</text>
<text x="250.0" y="296.0" class="t2" font-size="13" text-anchor="start" font-weight="normal" >Menor es mejor: 0 significa que el árbol reproduce los datos exactamente.</text>
<text x="250.0" y="316.0" class="t2" font-size="13" text-anchor="start" font-weight="normal" >Si algún resultado no es finito (desborde), el MSE vale +∞ y el árbol pierde.</text>
<text x="250.0" y="336.0" class="t2" font-size="13" text-anchor="start" font-weight="normal" >Se evalúa una fila a la vez (está prohibido evaluar por lotes).</text>
</svg>
