<line x1="145.0" y1="204.0" x2="170.0" y2="268.0" class="edge" />
<line x1="245.0" y1="204.0" x2="220.0" y2="268.0" class="edge" />
<line x1="245.0" y1="204.0" x2="270.0" y2="268.0" class="edge" />
<circle cx="195.0" cy="140.0" r="17" class="op"/>
<text x="195.0" y="145.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >−</text>
<circle cx="145.0" cy="204.0" r="17" class="op"/>
<text x="145.0" y="209.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >+</text>
<circle cx="120.0" cy="268.0" r="17" class="var"/>
<text x="120.0" y="272.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x1</text>
<circle cx="170.0" cy="268.0" r="17" class="var"/>
<text x="170.0" y="272.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x2</text>
<circle cx="245.0" cy="204.0" r="17" class="op"/>
<text x="245.0" y="209.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >+</text>
<circle cx="220.0" cy="268.0" r="17" class="cst"/>
<text x="220.0" y="272.7" class="cstt" font-size="13" text-anchor="middle" font-weight="500" >0.4</text>
<circle cx="270.0" cy="268.0" r="17" class="var"/>
<text x="270.0" y="272.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x1</text>
<text x="80.0" y="144.0" class="t3" font-size="11" text-anchor="end" font-weight="normal" >prof. 0</text>
<text x="80.0" y="208.0" class="t3" font-size="11" text-anchor="end" font-weight="normal" >prof. 1</text>
<text x="80.0" y="272.0" class="t3" font-size="11" text-anchor="end" font-weight="normal" >prof. 2</text>
<text x="500.0" y="92.0" class="t" font-size="14" text-anchor="start" font-weight="600" >grow_random(3): profundidad de A LO MÁS 3</text>
<line x1="602.0" y1="140.0" x2="560.0" y2="198.0" class="edge" />
<line x1="602.0" y1="140.0" x2="644.0" y2="198.0" class="edge" />
<line x1="644.0" y1="198.0" x2="616.0" y2="256.0" class="edge" />
<line x1="644.0" y1="198.0" x2="672.0" y2="256.0" class="edge" />
<line x1="616.0" y1="256.0" x2="616.0" y2="314.0" class="edge" />
<circle cx="602.0" cy="140.0" r="17" class="op"/>
<text x="602.0" y="145.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >×</text>
<circle cx="560.0" cy="198.0" r="17" class="var"/>
<text x="560.0" y="202.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x2</text>
<circle cx="644.0" cy="198.0" r="17" class="op"/>
<text x="644.0" y="203.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >−</text>
<circle cx="616.0" cy="256.0" r="17" class="op"/>
<text x="616.0" y="261.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >√</text>
<circle cx="616.0" cy="314.0" r="17" class="var"/>
<text x="616.0" y="318.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x1</text>
<circle cx="672.0" cy="256.0" r="17" class="cst"/>
<text x="672.0" y="260.7" class="cstt" font-size="13" text-anchor="middle" font-weight="500" >0.7</text>
<text x="70.0" y="378.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >Reglas comunes de A, B y C: operador 1/5 cada uno (+ − × ÷ √); una hoja es variable o constante con 1/2;</text>
<text x="70.0" y="397.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >las constantes son uniformes en [−1, 1); grow_random corta antes de tiempo con probabilidad 1/4.</text>
</svg>
