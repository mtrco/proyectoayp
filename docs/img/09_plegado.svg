<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-label="Plegado de constantes">
<title>Plegado de constantes</title>
<style>
text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.bg { fill: #fcfcfb; }
.card { fill: #f4f3ef; stroke: #e2e1dc; }
.t { fill: #0b0b0b; }
.t2 { fill: #52514e; }
.t3 { fill: #7a7974; }
.edge { stroke: #9b9a94; stroke-width: 2; fill: none; }
.edge2 { stroke: #c9c8c2; stroke-width: 2; fill: none; }
.grid { stroke: #e6e5e0; stroke-width: 1; }
.axis { stroke: #b9b8b2; stroke-width: 1; }
.op { fill: #6366f1; } .opt { fill: #ffffff; }
.var { fill: #3fb874; } .vart { fill: #08321b; }
.cst { fill: #d3d4de; } .cstt { fill: #23242a; }
.fold { fill: #f6c445; } .foldt { fill: #3a2a00; }
.s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
.s1s { stroke: #2a78d6; } .s2s { stroke: #eb6834; } .s3s { stroke: #1baf7a; }
.o1 { fill: #86b6ef; } .o2 { fill: #2a78d6; } .o3 { fill: #184f95; }
.ring { fill: none; stroke-width: 3; }
.dash { fill: none; stroke-width: 2; stroke-dasharray: 6 5; }
.hl { fill: #eb6834; fill-opacity: 0.10; stroke: #eb6834; stroke-width: 2; stroke-dasharray: 6 5; }
.hlb { fill: #2a78d6; fill-opacity: 0.08; stroke: #2a78d6; stroke-width: 2; stroke-dasharray: 6 5; }
.good { fill: #0ca30c; } .bad { fill: #d03b3b; }
.goods { stroke: #0ca30c; } .bads { stroke: #d03b3b; }
.cell { fill: #ffffff; stroke: #cfcec8; }
.arrow { stroke: #7a7974; stroke-width: 2; fill: none; marker-end: url(#ah); }
.ah { fill: #7a7974; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; }
  .card { fill: #242423; stroke: #3a3a37; }
  .t { fill: #f0efec; }
  .t2 { fill: #c3c2b7; }
  .t3 { fill: #9d9c95; }
  .edge { stroke: #8f8e88; }
  .edge2 { stroke: #4a4a46; }
  .grid { stroke: #2f2f2d; }
  .axis { stroke: #55554f; }
  .op { fill: #7c7ff5; }
  .var { fill: #2f9e63; } .vart { fill: #ecfff3; }
  .cst { fill: #55565f; } .cstt { fill: #f2f2f6; }
  .fold { fill: #c99a1c; } .foldt { fill: #1d1500; }
  .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
  .s1s { stroke: #3987e5; } .s2s { stroke: #d95926; } .s3s { stroke: #199e70; }
  .o1 { fill: #184f95; } .o2 { fill: #3987e5; } .o3 { fill: #86b6ef; }
  .hl { fill: #d95926; stroke: #d95926; }
  .hlb { fill: #3987e5; stroke: #3987e5; }
  .cell { fill: #20201f; stroke: #45453f; }
  .arrow { stroke: #9d9c95; }
  .ah { fill: #9d9c95; }
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect width="880" height="390" rx="14" class="bg"/>
<text x="28.0" y="38.0" class="t" font-size="19" text-anchor="start" font-weight="700" >Plegado de constantes: calcular una vez lo que no depende de la fila</text>
<rect x="58.0" y="144.0" width="94.0" height="156.0" rx="22" class="hl" />
<rect x="210.0" y="202.0" width="90.0" height="96.0" rx="20" class="hl" />
<line x1="161.2" y1="110.0" x2="105.0" y2="166.0" class="edge" />
<line x1="161.2" y1="110.0" x2="217.5" y2="166.0" class="edge" />
<line x1="105.0" y1="166.0" x2="80.0" y2="222.0" class="edge" />
<line x1="105.0" y1="166.0" x2="130.0" y2="222.0" class="edge" />
<line x1="80.0" y1="222.0" x2="80.0" y2="278.0" class="edge" />
<line x1="217.5" y1="166.0" x2="180.0" y2="222.0" class="edge" />
<line x1="217.5" y1="166.0" x2="255.0" y2="222.0" class="edge" />
<line x1="255.0" y1="222.0" x2="230.0" y2="278.0" class="edge" />
<line x1="255.0" y1="222.0" x2="280.0" y2="278.0" class="edge" />
<circle cx="161.2" cy="110.0" r="16" class="op"/>
<text x="161.2" y="115.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >×</text>
<circle cx="105.0" cy="166.0" r="16" class="op"/>
<text x="105.0" y="171.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >+</text>
<circle cx="80.0" cy="222.0" r="16" class="op"/>
<text x="80.0" y="227.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >√</text>
<circle cx="80.0" cy="278.0" r="16" class="cst"/>
<text x="80.0" y="282.7" class="cstt" font-size="13" text-anchor="middle" font-weight="500" >0.25</text>
<circle cx="130.0" cy="222.0" r="16" class="cst"/>
<text x="130.0" y="226.7" class="cstt" font-size="13" text-anchor="middle" font-weight="500" >0.1</text>
<circle cx="217.5" cy="166.0" r="16" class="op"/>
<text x="217.5" y="171.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >−</text>
<circle cx="180.0" cy="222.0" r="16" class="var"/>
<text x="180.0" y="226.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x1</text>
<circle cx="255.0" cy="222.0" r="16" class="op"/>
<text x="255.0" y="227.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >÷</text>
<circle cx="230.0" cy="278.0" r="16" class="cst"/>
<text x="230.0" y="282.7" class="cstt" font-size="13" text-anchor="middle" font-weight="500" >1</text>
<circle cx="280.0" cy="278.0" r="16" class="cst"/>
<text x="280.0" y="282.7" class="cstt" font-size="13" text-anchor="middle" font-weight="500" >0</text>
<line x1="400.0" y1="200.0" x2="470.0" y2="200.0" class="arrow" />
<line x1="605.0" y1="160.0" x2="560.0" y2="220.0" class="edge" />
<line x1="605.0" y1="160.0" x2="650.0" y2="220.0" class="edge" />
<line x1="650.0" y1="220.0" x2="620.0" y2="280.0" class="edge" />
<line x1="650.0" y1="220.0" x2="680.0" y2="280.0" class="edge" />
<circle cx="605.0" cy="160.0" r="19" class="op"/>
<text x="605.0" y="165.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >×</text>
<circle cx="560.0" cy="220.0" r="19" class="fold"/>
<text x="560.0" y="224.7" class="foldt" font-size="13" text-anchor="middle" font-weight="600" >0.6</text>
<circle cx="650.0" cy="220.0" r="19" class="op"/>
<text x="650.0" y="225.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >−</text>
<circle cx="620.0" cy="280.0" r="19" class="var"/>
<text x="620.0" y="284.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x1</text>
<circle cx="680.0" cy="280.0" r="19" class="fold"/>
<text x="680.0" y="284.7" class="foldt" font-size="13" text-anchor="middle" font-weight="600" >1e12</text>
<circle cx="527" cy="346" r="7" class="op"/>
<text x="540.0" y="350.0" class="t2" font-size="12" text-anchor="start" font-weight="normal" >Operador</text>
<circle cx="618.6" cy="346" r="7" class="var"/>
<text x="631.6" y="350.0" class="t2" font-size="12" text-anchor="start" font-weight="normal" >Variable</text>
<circle cx="710.2" cy="346" r="7" class="fold"/>
<text x="723.2" y="350.0" class="t2" font-size="12" text-anchor="start" font-weight="normal" >Subárbol plegado</text>
<text x="40.0" y="350.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >Sin variables, el subárbol vale lo mismo en todas las filas.</text>
<text x="40.0" y="368.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >Se calcula una vez con las mismas operaciones protegidas.</text>
<text x="500.0" y="100.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >La evaluación lee 0.6 y 1e12 sin recorrer nada.</text>
<text x="500.0" y="120.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >El árbol (expresión, tamaño, cortes) no cambia.</text>
</svg>
