<text x="546.0" y="330.0" class="t3" font-size="12" text-anchor="middle" font-weight="normal" >padre A</text>
<text x="722.0" y="330.0" class="t3" font-size="12" text-anchor="middle" font-weight="normal" >padre B</text>
<circle cx="620" cy="430" r="17" class="op"/>
<circle cx="620" cy="430" r="21" class="ring s2s"/>
<text x="620.0" y="436.0" class="opt" font-size="16" text-anchor="middle" font-weight="600" >+</text>
<path d="M610.0,416.0 Q542.6,339.3 506.0,244.0" class="arrow" />
<path d="M632.0,417.0 Q680.9,336.5 692.0,243.0" class="arrow" />
<text x="620.0" y="474.0" class="t2" font-size="12" text-anchor="middle" font-weight="normal" >hijo 1 = 1 nodo nuevo</text>
<text x="470.0" y="560.0" class="t2" font-size="12" text-anchor="start" font-weight="normal" >El hijo reutiliza x1 de A y √x3 de B tal cual: solo se crean</text>
<text x="470.0" y="577.0" class="t2" font-size="12" text-anchor="start" font-weight="normal" >los nodos del camino de la raíz al corte (≤ 1 por nivel).</text>
