<svg xmlns="http://www.w3.org/2000/svg" width="880" height="610" viewBox="0 0 880 610" role="img" aria-label="Crossover convencional contra copia de camino">
<title>Crossover convencional contra copia de camino</title>
<style>
text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.bg { fill: #fcfcfb; }
.card { fill: #f4f3ef; stroke: #e2e1dc; }
