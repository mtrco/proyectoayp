<text x="124.0" y="532.0" class="t3" font-size="12" text-anchor="middle" font-weight="normal" >hijo 1</text>
<text x="292.0" y="532.0" class="t3" font-size="12" text-anchor="middle" font-weight="normal" >hijo 2</text>
<text x="40.0" y="560.0" class="t2" font-size="12" text-anchor="start" font-weight="normal" >Todos los nodos de los hijos son nuevos (anillo naranja):</text>
<text x="40.0" y="577.0" class="t2" font-size="12" text-anchor="start" font-weight="normal" >clonar cuesta tanto como el tamaño de los padres.</text>
<rect x="450.0" y="82.0" width="410.0" height="510.0" rx="10" class="card" />
<text x="470.0" y="110.0" class="t" font-size="14" text-anchor="start" font-weight="700" >C: copia de camino (se comparten nodos)</text>
<rect x="522.0" y="204.0" width="94.0" height="106.0" rx="24" class="hl" />
<line x1="534.5" y1="170.0" x2="500.0" y2="228.0" class="edge" />
