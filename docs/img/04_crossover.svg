<circle cx="500.0" cy="228.0" r="16" class="var"/>
<text x="500.0" y="232.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x1</text>
<circle cx="569.0" cy="228.0" r="16" class="op"/>
