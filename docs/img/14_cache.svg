<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="Cache de resultados por nodo">
<title>Cache de resultados por nodo</title>
<style>
text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.bg { fill: #fcfcfb; }
.card { fill: #f4f3ef; stroke: #e2e1dc; }
.t { fill: #0b0b0b; }
.t2 { fill: #52514e; }
.t3 { fill: #7a7974; }
.edge { stroke: #9b9a94; stroke-width: 2; fill: none; }
.edge2 { stroke: #c9c8c2; stroke-width: 2; fill: none; }
.grid { stroke: #e6e5e0; stroke-width: 1; }
.axis { stroke: #b9b8b2; stroke-width: 1; }
.op { fill: #6366f1; } .opt { fill: #ffffff; }
.var { fill: #3fb874; } .vart { fill: #08321b; }
.cst { fill: #d3d4de; } .cstt { fill: #23242a; }
.fold { fill: #f6c445; } .foldt { fill: #3a2a00; }
.s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
.s1s { stroke: #2a78d6; } .s2s { stroke: #eb6834; } .s3s { stroke: #1baf7a; }
.o1 { fill: #86b6ef; } .o2 { fill: #2a78d6; } .o3 { fill: #184f95; }
.ring { fill: none; stroke-width: 3; }
.dash { fill: none; stroke-width: 2; stroke-dasharray: 6 5; }
.hl { fill: #eb6834; fill-opacity: 0.10; stroke: #eb6834; stroke-width: 2; stroke-dasharray: 6 5; }
.hlb { fill: #2a78d6; fill-opacity: 0.08; stroke: #2a78d6; stroke-width: 2; stroke-dasharray: 6 5; }
.good { fill: #0ca30c; } .bad { fill: #d03b3b; }
.goods { stroke: #0ca30c; } .bads { stroke: #d03b3b; }
.cell { fill: #ffffff; stroke: #cfcec8; }
.arrow { stroke: #7a7974; stroke-width: 2; fill: none; marker-end: url(#ah); }
.ah { fill: #7a7974; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; }
  .card { fill: #242423; stroke: #3a3a37; }
  .t { fill: #f0efec; }
  .t2 { fill: #c3c2b7; }
  .t3 { fill: #9d9c95; }
  .edge { stroke: #8f8e88; }
  .edge2 { stroke: #4a4a46; }
  .grid { stroke: #2f2f2d; }
  .axis { stroke: #55554f; }
  .op { fill: #7c7ff5; }
  .var { fill: #2f9e63; } .vart { fill: #ecfff3; }
  .cst { fill: #55565f; } .cstt { fill: #f2f2f6; }
  .fold { fill: #c99a1c; } .foldt { fill: #1d1500; }
  .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
  .s1s { stroke: #3987e5; } .s2s { stroke: #d95926; } .s3s { stroke: #199e70; }
  .o1 { fill: #184f95; } .o2 { fill: #3987e5; } .o3 { fill: #86b6ef; }
  .hl { fill: #d95926; stroke: #d95926; }
  .hlb { fill: #3987e5; stroke: #3987e5; }
  .cell { fill: #20201f; stroke: #45453f; }
  .arrow { stroke: #9d9c95; }
  .ah { fill: #9d9c95; }
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect width="880" height="400" rx="14" class="bg"/>
<text x="28.0" y="38.0" class="t" font-size="19" text-anchor="start" font-weight="700" >Cache de resultados: el hijo reutiliza lo que ya calcularon sus padres</text>
<text x="28.0" y="60.0" class="t2" font-size="13" text-anchor="start" font-weight="normal" >Los nodos con tamaño ≥ S guardan su valor en cada una de las n filas.</text>
<rect x="50.0" y="156.0" width="178.0" height="152.0" rx="20" class="hlb" />
<line x1="208.0" y1="120.0" x2="139.0" y2="176.0" class="edge" />
<line x1="208.0" y1="120.0" x2="277.0" y2="176.0" class="edge" />
<line x1="139.0" y1="176.0" x2="93.0" y2="232.0" class="edge" />
<line x1="139.0" y1="176.0" x2="185.0" y2="232.0" class="edge" />
<line x1="93.0" y1="232.0" x2="70.0" y2="288.0" class="edge" />
<line x1="93.0" y1="232.0" x2="116.0" y2="288.0" class="edge" />
<line x1="185.0" y1="232.0" x2="162.0" y2="288.0" class="edge" />
<line x1="185.0" y1="232.0" x2="208.0" y2="288.0" class="edge" />
<line x1="277.0" y1="176.0" x2="277.0" y2="232.0" class="edge" />
<line x1="277.0" y1="232.0" x2="254.0" y2="288.0" class="edge" />
<line x1="277.0" y1="232.0" x2="300.0" y2="288.0" class="edge" />
<circle cx="208.0" cy="120.0" r="15" class="op"/>
<text x="208.0" y="125.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >+</text>
<circle cx="139.0" cy="176.0" r="15" class="op"/>
<text x="139.0" y="181.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >×</text>
<circle cx="93.0" cy="232.0" r="15" class="op"/>
<text x="93.0" y="237.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >+</text>
<circle cx="70.0" cy="288.0" r="15" class="var"/>
<text x="70.0" y="292.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x1</text>
<circle cx="116.0" cy="288.0" r="15" class="cst"/>
<text x="116.0" y="292.7" class="cstt" font-size="13" text-anchor="middle" font-weight="500" >0.3</text>
<circle cx="185.0" cy="232.0" r="15" class="op"/>
<text x="185.0" y="237.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >−</text>
<circle cx="162.0" cy="288.0" r="15" class="var"/>
<text x="162.0" y="292.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x2</text>
<circle cx="208.0" cy="288.0" r="15" class="var"/>
<text x="208.0" y="292.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x1</text>
<circle cx="277.0" cy="176.0" r="15" class="op"/>
<text x="277.0" y="181.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >√</text>
<circle cx="277.0" cy="232.0" r="15" class="op"/>
<text x="277.0" y="237.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >×</text>
<circle cx="254.0" cy="288.0" r="15" class="var"/>
<text x="254.0" y="292.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x2</text>
<circle cx="300.0" cy="288.0" r="15" class="cst"/>
<text x="300.0" y="292.7" class="cstt" font-size="13" text-anchor="middle" font-weight="500" >0.5</text>
<text x="36.0" y="368.0" class="t2" font-size="12" text-anchor="start" font-weight="normal" >subárbol con cache (tamaño ≥ S)</text>
<text x="420.0" y="110.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >cache del subárbol azul, una entrada por fila:</text>
<rect x="420.0" y="122.0" width="54.0" height="30.0" rx="5" class="cell" />
<text x="447.0" y="142.0" class="t mono" font-size="12" text-anchor="middle" font-weight="normal" >0.91</text>
<rect x="478.0" y="122.0" width="54.0" height="30.0" rx="5" class="cell" />
<text x="505.0" y="142.0" class="t mono" font-size="12" text-anchor="middle" font-weight="normal" >−2.4</text>
<rect x="536.0" y="122.0" width="54.0" height="30.0" rx="5" class="cell" />
<text x="563.0" y="142.0" class="t mono" font-size="12" text-anchor="middle" font-weight="normal" >0.07</text>
<rect x="594.0" y="122.0" width="54.0" height="30.0" rx="5" class="cell" />
<text x="621.0" y="142.0" class="t mono" font-size="12" text-anchor="middle" font-weight="normal" >1.33</text>
<rect x="652.0" y="122.0" width="54.0" height="30.0" rx="5" class="cell" />
<text x="679.0" y="142.0" class="t mono" font-size="12" text-anchor="middle" font-weight="normal" >…</text>
<rect x="710.0" y="122.0" width="54.0" height="30.0" rx="5" class="cell" />
<text x="737.0" y="142.0" class="t mono" font-size="12" text-anchor="middle" font-weight="normal" >0.52</text>
<text x="447.0" y="168.0" class="t3" font-size="11" text-anchor="middle" font-weight="normal" >fila 1</text>
<text x="505.0" y="168.0" class="t3" font-size="11" text-anchor="middle" font-weight="normal" >fila 2</text>
<text x="563.0" y="168.0" class="t3" font-size="11" text-anchor="middle" font-weight="normal" >fila 3</text>
<text x="621.0" y="168.0" class="t3" font-size="11" text-anchor="middle" font-weight="normal" >fila 4</text>
<text x="679.0" y="168.0" class="t3" font-size="11" text-anchor="middle" font-weight="normal" ></text>
<text x="737.0" y="168.0" class="t3" font-size="11" text-anchor="middle" font-weight="normal" >fila n</text>
<text x="420.0" y="220.0" class="t" font-size="13.5" text-anchor="start" font-weight="600" >Hijo de una mutación en la rama derecha:</text>
<text x="420.0" y="244.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >• el subárbol izquierdo es EL MISMO nodo del padre: en cada fila</text>
<text x="420.0" y="263.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >  se lee su valor del cache (1 lectura en lugar de 7 nodos);</text>
<text x="420.0" y="282.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >• solo se calculan la raíz nueva y la rama que cambió;</text>
<text x="420.0" y="301.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >• debajo de S se evalúa directo (no vale la pena guardar).</text>
<text x="420.0" y="320.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >El cache se llena en la primera evaluación, se marca completo al</text>
<text x="420.0" y="339.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >terminar y se descarta si el MSE resulta +∞.</text>
</svg>
