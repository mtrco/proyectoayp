<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="Cómo se guarda un nodo en B y en C">
<title>Cómo se guarda un nodo en B y en C</title>
<style>
text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.bg { fill: #fcfcfb; }
.card { fill: #f4f3ef; stroke: #e2e1dc; }
.t { fill: #0b0b0b; }
.t2 { fill: #52514e; }
.t3 { fill: #7a7974; }
.edge { stroke: #9b9a94; stroke-width: 2; fill: none; }
.edge2 { stroke: #c9c8c2; stroke-width: 2; fill: none; }
.grid { stroke: #e6e5e0; stroke-width: 1; }
.axis { stroke: #b9b8b2; stroke-width: 1; }
.op { fill: #6366f1; } .opt { fill: #ffffff; }
.var { fill: #3fb874; } .vart { fill: #08321b; }
.cst { fill: #d3d4de; } .cstt { fill: #23242a; }
.fold { fill: #f6c445; } .foldt { fill: #3a2a00; }
.s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
.s1s { stroke: #2a78d6; } .s2s { stroke: #eb6834; } .s3s { stroke: #1baf7a; }
.o1 { fill: #86b6ef; } .o2 { fill: #2a78d6; } .o3 { fill: #184f95; }
.ring { fill: none; stroke-width: 3; }
.dash { fill: none; stroke-width: 2; stroke-dasharray: 6 5; }
.hl { fill: #eb6834; fill-opacity: 0.10; stroke: #eb6834; stroke-width: 2; stroke-dasharray: 6 5; }
.hlb { fill: #2a78d6; fill-opacity: 0.08; stroke: #2a78d6; stroke-width: 2; stroke-dasharray: 6 5; }
.good { fill: #0ca30c; } .bad { fill: #d03b3b; }
.goods { stroke: #0ca30c; } .bads { stroke: #d03b3b; }
.cell { fill: #ffffff; stroke: #cfcec8; }
.arrow { stroke: #7a7974; stroke-width: 2; fill: none; marker-end: url(#ah); }
.ah { fill: #7a7974; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; }
  .card { fill: #242423; stroke: #3a3a37; }
  .t { fill: #f0efec; }
  .t2 { fill: #c3c2b7; }
  .t3 { fill: #9d9c95; }
  .edge { stroke: #8f8e88; }
  .edge2 { stroke: #4a4a46; }
  .grid { stroke: #2f2f2d; }
  .axis { stroke: #55554f; }
  .op { fill: #7c7ff5; }
  .var { fill: #2f9e63; } .vart { fill: #ecfff3; }
  .cst { fill: #55565f; } .cstt { fill: #f2f2f6; }
  .fold { fill: #c99a1c; } .foldt { fill: #1d1500; }
  .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
  .s1s { stroke: #3987e5; } .s2s { stroke: #d95926; } .s3s { stroke: #199e70; }
  .o1 { fill: #184f95; } .o2 { fill: #3987e5; } .o3 { fill: #86b6ef; }
  .hl { fill: #d95926; stroke: #d95926; }
  .hlb { fill: #3987e5; stroke: #3987e5; }
  .cell { fill: #20201f; stroke: #45453f; }
  .arrow { stroke: #9d9c95; }
  .ah { fill: #9d9c95; }
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect width="880" height="330" rx="14" class="bg"/>
<text x="28.0" y="38.0" class="t" font-size="19" text-anchor="start" font-weight="700" >Un nodo en memoria: B (32 bytes) y C (24 bytes)</text>
<text x="28.0" y="60.0" class="t2" font-size="13" text-anchor="start" font-weight="normal" >Cada casilla es un byte; los campos de 1 byte van abreviados.</text>
<text x="28.0" y="100.0" class="t" font-size="13.5" text-anchor="start" font-weight="600" >B · struct Node: objeto independiente enlazado con unique_ptr</text>
<rect x="28.0" y="112.0" width="20.0" height="42.0" rx="6" class="cell" />
<text x="38.0" y="138.0" class="t" font-size="12" text-anchor="middle" font-weight="normal" >k</text>
<rect x="50.0" y="112.0" width="20.0" height="42.0" rx="6" class="cell" />
<text x="60.0" y="138.0" class="t" font-size="12" text-anchor="middle" font-weight="normal" >d</text>
<rect x="72.0" y="112.0" width="130.0" height="42.0" rx="6" class="cell" />
<text x="137.0" y="138.0" class="t2" font-size="12" text-anchor="middle" font-weight="normal" >relleno</text>
<rect x="204.0" y="112.0" width="174.0" height="42.0" rx="6" class="cell" />
<text x="291.0" y="138.0" class="t" font-size="12" text-anchor="middle" font-weight="normal" >value | var</text>
<rect x="380.0" y="112.0" width="174.0" height="42.0" rx="6" class="cell" />
<text x="467.0" y="138.0" class="t" font-size="12" text-anchor="middle" font-weight="normal" >left →</text>
<rect x="556.0" y="112.0" width="174.0" height="42.0" rx="6" class="cell" />
<text x="643.0" y="138.0" class="t" font-size="12" text-anchor="middle" font-weight="normal" >right →</text>
<text x="742.0" y="138.0" class="t" font-size="13" text-anchor="start" font-weight="700" >32 bytes</text>
<text x="28.0" y="172.0" class="t3" font-size="11.5" text-anchor="start" font-weight="normal" >k = kind (tipo), d = direct (se lee directo). value guarda la constante, el valor plegado o el índice de variable.</text>
<text x="28.0" y="210.0" class="t" font-size="13.5" text-anchor="start" font-weight="600" >C · NodeRec: registro dentro de un Vector (sin punteros: isbits)</text>
<rect x="28.0" y="222.0" width="86.0" height="42.0" rx="6" class="cell" />
<text x="71.0" y="248.0" class="t" font-size="12" text-anchor="middle" font-weight="normal" >left</text>
<rect x="116.0" y="222.0" width="86.0" height="42.0" rx="6" class="cell" />
<text x="159.0" y="248.0" class="t" font-size="12" text-anchor="middle" font-weight="normal" >right</text>
<rect x="204.0" y="222.0" width="86.0" height="42.0" rx="6" class="cell" />
<text x="247.0" y="248.0" class="t" font-size="12" text-anchor="middle" font-weight="normal" >size</text>
<rect x="292.0" y="222.0" width="42.0" height="42.0" rx="6" class="cell" />
<text x="313.0" y="248.0" class="t" font-size="12" text-anchor="middle" font-weight="normal" >height</text>
<rect x="336.0" y="222.0" width="20.0" height="42.0" rx="6" class="cell" />
<text x="346.0" y="248.0" class="t" font-size="12" text-anchor="middle" font-weight="normal" >k</text>
<rect x="358.0" y="222.0" width="20.0" height="42.0" rx="6" class="cell" />
<text x="368.0" y="248.0" class="t" font-size="12" text-anchor="middle" font-weight="normal" >f</text>
<rect x="380.0" y="222.0" width="174.0" height="42.0" rx="6" class="cell" />
<text x="467.0" y="248.0" class="t" font-size="12" text-anchor="middle" font-weight="normal" >value</text>
<text x="566.0" y="248.0" class="t" font-size="13" text-anchor="start" font-weight="700" >24 bytes</text>
<text x="28.0" y="282.0" class="t3" font-size="11.5" text-anchor="start" font-weight="normal" >left y right son POSICIONES en el arreglo (Int32), no direcciones. f = flags (plegado). value: constante,</text>
<text x="28.0" y="300.0" class="t3" font-size="11.5" text-anchor="start" font-weight="normal" >valor plegado o mayor índice de variable del subárbol. Sin punteros, el recolector de basura no revisa nada.</text>
</svg>
