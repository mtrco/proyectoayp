<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-label="Un individuo es un árbol">
<title>Un individuo es un árbol</title>
<style>
text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.bg { fill: #fcfcfb; }
.card { fill: #f4f3ef; stroke: #e2e1dc; }
.t { fill: #0b0b0b; }
.t2 { fill: #52514e; }
.t3 { fill: #7a7974; }
.edge { stroke: #9b9a94; stroke-width: 2; fill: none; }
.edge2 { stroke: #c9c8c2; stroke-width: 2; fill: none; }
.grid { stroke: #e6e5e0; stroke-width: 1; }
.axis { stroke: #b9b8b2; stroke-width: 1; }
.op { fill: #6366f1; } .opt { fill: #ffffff; }
.var { fill: #3fb874; } .vart { fill: #08321b; }
.cst { fill: #d3d4de; } .cstt { fill: #23242a; }
.fold { fill: #f6c445; } .foldt { fill: #3a2a00; }
.s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
.s1s { stroke: #2a78d6; } .s2s { stroke: #eb6834; } .s3s { stroke: #1baf7a; }
.o1 { fill: #86b6ef; } .o2 { fill: #2a78d6; } .o3 { fill: #184f95; }
.ring { fill: none; stroke-width: 3; }
.dash { fill: none; stroke-width: 2; stroke-dasharray: 6 5; }
.hl { fill: #eb6834; fill-opacity: 0.10; stroke: #eb6834; stroke-width: 2; stroke-dasharray: 6 5; }
.hlb { fill: #2a78d6; fill-opacity: 0.08; stroke: #2a78d6; stroke-width: 2; stroke-dasharray: 6 5; }
.good { fill: #0ca30c; } .bad { fill: #d03b3b; }
.goods { stroke: #0ca30c; } .bads { stroke: #d03b3b; }
.cell { fill: #ffffff; stroke: #cfcec8; }
.arrow { stroke: #7a7974; stroke-width: 2; fill: none; marker-end: url(#ah); }
.ah { fill: #7a7974; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; }
  .card { fill: #242423; stroke: #3a3a37; }
  .t { fill: #f0efec; }
  .t2 { fill: #c3c2b7; }
  .t3 { fill: #9d9c95; }
  .edge { stroke: #8f8e88; }
  .edge2 { stroke: #4a4a46; }
  .grid { stroke: #2f2f2d; }
  .axis { stroke: #55554f; }
  .op { fill: #7c7ff5; }
  .var { fill: #2f9e63; } .vart { fill: #ecfff3; }
  .cst { fill: #55565f; } .cstt { fill: #f2f2f6; }
  .fold { fill: #c99a1c; } .foldt { fill: #1d1500; }
  .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
  .s1s { stroke: #3987e5; } .s2s { stroke: #d95926; } .s3s { stroke: #199e70; }
  .o1 { fill: #184f95; } .o2 { fill: #3987e5; } .o3 { fill: #86b6ef; }
  .hl { fill: #d95926; stroke: #d95926; }
  .hlb { fill: #3987e5; stroke: #3987e5; }
  .cell { fill: #20201f; stroke: #45453f; }
  .arrow { stroke: #9d9c95; }
  .ah { fill: #9d9c95; }
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect width="880" height="460" rx="14" class="bg"/>
<text x="28.0" y="38.0" class="t" font-size="19" text-anchor="start" font-weight="700" >Un individuo es un árbol</text>
<text x="28.0" y="60.0" class="t2" font-size="13" text-anchor="start" font-weight="normal" >Los nodos internos son operaciones; las hojas, variables o constantes.</text>
<line x1="281.8" y1="120.0" x2="196.5" y2="186.0" class="edge" />
<line x1="281.8" y1="120.0" x2="367.0" y2="186.0" class="edge" />
<line x1="196.5" y1="186.0" x2="150.0" y2="252.0" class="edge" />
<line x1="196.5" y1="186.0" x2="243.0" y2="252.0" class="edge" />
<line x1="243.0" y1="252.0" x2="243.0" y2="318.0" class="edge" />
<line x1="243.0" y1="318.0" x2="212.0" y2="384.0" class="edge" />
<line x1="243.0" y1="318.0" x2="274.0" y2="384.0" class="edge" />
<line x1="367.0" y1="186.0" x2="336.0" y2="252.0" class="edge" />
<line x1="367.0" y1="186.0" x2="398.0" y2="252.0" class="edge" />
<circle cx="281.8" cy="120.0" r="20" class="op"/>
<text x="281.8" y="125.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >×</text>
<circle cx="196.5" cy="186.0" r="20" class="op"/>
<text x="196.5" y="191.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >+</text>
<circle cx="150.0" cy="252.0" r="20" class="var"/>
<text x="150.0" y="256.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x2</text>
<circle cx="243.0" cy="252.0" r="20" class="op"/>
<text x="243.0" y="257.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >√</text>
<circle cx="243.0" cy="318.0" r="20" class="op"/>
<text x="243.0" y="323.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >−</text>
<circle cx="212.0" cy="384.0" r="20" class="var"/>
<text x="212.0" y="388.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x1</text>
<circle cx="274.0" cy="384.0" r="20" class="cst"/>
<text x="274.0" y="388.7" class="cstt" font-size="13" text-anchor="middle" font-weight="500" >0.1</text>
<circle cx="367.0" cy="186.0" r="20" class="op"/>
<text x="367.0" y="191.8" class="opt" font-size="16" text-anchor="middle" font-weight="600" >÷</text>
<circle cx="336.0" cy="252.0" r="20" class="var"/>
<text x="336.0" y="256.7" class="vart" font-size="13" text-anchor="middle" font-weight="600" >x3</text>
<circle cx="398.0" cy="252.0" r="20" class="cst"/>
<text x="398.0" y="256.7" class="cstt" font-size="13" text-anchor="middle" font-weight="500" >0.3</text>
<text x="110.0" y="124.0" class="t3" font-size="11" text-anchor="end" font-weight="normal" >prof. 0</text>
<text x="110.0" y="190.0" class="t3" font-size="11" text-anchor="end" font-weight="normal" >prof. 1</text>
<text x="110.0" y="256.0" class="t3" font-size="11" text-anchor="end" font-weight="normal" >prof. 2</text>
<text x="110.0" y="322.0" class="t3" font-size="11" text-anchor="end" font-weight="normal" >prof. 3</text>
<text x="110.0" y="388.0" class="t3" font-size="11" text-anchor="end" font-weight="normal" >prof. 4</text>
<circle cx="67" cy="436" r="7" class="op"/>
<text x="80.0" y="440.0" class="t2" font-size="12" text-anchor="start" font-weight="normal" >Operador</text>
<circle cx="158.6" cy="436" r="7" class="var"/>
<text x="171.6" y="440.0" class="t2" font-size="12" text-anchor="start" font-weight="normal" >Variable</text>
<circle cx="250.2" cy="436" r="7" class="cst"/>
<text x="263.2" y="440.0" class="t2" font-size="12" text-anchor="start" font-weight="normal" >Constante</text>
<rect x="480.0" y="100.0" width="372.0" height="268.0" rx="10" class="card" />
<text x="500.0" y="132.0" class="t" font-size="15" text-anchor="start" font-weight="700" >Se lee de abajo hacia arriba</text>
<text x="500.0" y="160.0" class="t2" font-size="13" text-anchor="start" font-weight="normal" >1. Cada hoja da un número: una variable</text>
<text x="500.0" y="180.0" class="t2" font-size="13" text-anchor="start" font-weight="normal" >   (x1, x2, x3 vienen de la fila de datos)</text>
<text x="500.0" y="200.0" class="t2" font-size="13" text-anchor="start" font-weight="normal" >   o una constante (0.1, 0.3).</text>
<text x="500.0" y="220.0" class="t2" font-size="13" text-anchor="start" font-weight="normal" >2. Cada operador combina el valor de sus</text>
<text x="500.0" y="240.0" class="t2" font-size="13" text-anchor="start" font-weight="normal" >   hijos: + − × ÷ con dos hijos, √ con uno.</text>
<text x="500.0" y="260.0" class="t2" font-size="13" text-anchor="start" font-weight="normal" >3. La raíz da la predicción del árbol.</text>
<text x="500.0" y="300.0" class="t2" font-size="12" text-anchor="start" font-weight="normal" >Expresión que genera expression():</text>
<text x="500.0" y="324.0" class="t mono" font-size="12.5" text-anchor="start" font-weight="normal" >((x2 + sqrt((x1 - 0.1))) * (x3 / 0.3))</text>
<text x="500.0" y="350.0" class="t2" font-size="12" text-anchor="start" font-weight="normal" >Profundidad del árbol: 4 (la raíz está en 0).</text>
</svg>
