<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-label="Evaluación con saltos contra sin saltos">
<title>Evaluación con saltos contra sin saltos</title>
<style>
text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.bg { fill: #fcfcfb; }
.card { fill: #f4f3ef; stroke: #e2e1dc; }
.t { fill: #0b0b0b; }
.t2 { fill: #52514e; }
.t3 { fill: #7a7974; }
.edge { stroke: #9b9a94; stroke-width: 2; fill: none; }
.edge2 { stroke: #c9c8c2; stroke-width: 2; fill: none; }
.grid { stroke: #e6e5e0; stroke-width: 1; }
.axis { stroke: #b9b8b2; stroke-width: 1; }
.op { fill: #6366f1; } .opt { fill: #ffffff; }
.var { fill: #3fb874; } .vart { fill: #08321b; }
.cst { fill: #d3d4de; } .cstt { fill: #23242a; }
.fold { fill: #f6c445; } .foldt { fill: #3a2a00; }
.s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
.s1s { stroke: #2a78d6; } .s2s { stroke: #eb6834; } .s3s { stroke: #1baf7a; }
.o1 { fill: #86b6ef; } .o2 { fill: #2a78d6; } .o3 { fill: #184f95; }
.ring { fill: none; stroke-width: 3; }
.dash { fill: none; stroke-width: 2; stroke-dasharray: 6 5; }
.hl { fill: #eb6834; fill-opacity: 0.10; stroke: #eb6834; stroke-width: 2; stroke-dasharray: 6 5; }
.hlb { fill: #2a78d6; fill-opacity: 0.08; stroke: #2a78d6; stroke-width: 2; stroke-dasharray: 6 5; }
.good { fill: #0ca30c; } .bad { fill: #d03b3b; }
.goods { stroke: #0ca30c; } .bads { stroke: #d03b3b; }
.cell { fill: #ffffff; stroke: #cfcec8; }
.arrow { stroke: #7a7974; stroke-width: 2; fill: none; marker-end: url(#ah); }
.ah { fill: #7a7974; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; }
  .card { fill: #242423; stroke: #3a3a37; }
  .t { fill: #f0efec; }
  .t2 { fill: #c3c2b7; }
  .t3 { fill: #9d9c95; }
  .edge { stroke: #8f8e88; }
  .edge2 { stroke: #4a4a46; }
  .grid { stroke: #2f2f2d; }
  .axis { stroke: #55554f; }
  .op { fill: #7c7ff5; }
  .var { fill: #2f9e63; } .vart { fill: #ecfff3; }
  .cst { fill: #55565f; } .cstt { fill: #f2f2f6; }
  .fold { fill: #c99a1c; } .foldt { fill: #1d1500; }
  .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
  .s1s { stroke: #3987e5; } .s2s { stroke: #d95926; } .s3s { stroke: #199e70; }
  .o1 { fill: #184f95; } .o2 { fill: #3987e5; } .o3 { fill: #86b6ef; }
  .hl { fill: #d95926; stroke: #d95926; }
  .hlb { fill: #3987e5; stroke: #3987e5; }
  .cell { fill: #20201f; stroke: #45453f; }
  .arrow { stroke: #9d9c95; }
  .ah { fill: #9d9c95; }
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect width="880" height="380" rx="14" class="bg"/>
<text x="28.0" y="38.0" class="t" font-size="19" text-anchor="start" font-weight="700" >Evaluación sin saltos: calcular de más para no adivinar</text>
<text x="28.0" y="60.0" class="t2" font-size="13" text-anchor="start" font-weight="normal" >El procesador adivina hacia dónde va cada if/switch. Si se equivoca, tira ~15–20 ciclos.</text>
<rect x="20.0" y="86.0" width="410.0" height="270.0" rx="10" class="card" />
<text x="40.0" y="114.0" class="t" font-size="14" text-anchor="start" font-weight="700" >Con salto (antes): switch por tipo de nodo</text>
<text x="225.0" y="150.0" class="t2" font-size="12.5" text-anchor="middle" font-weight="normal" >¿qué operador es?</text>
<rect x="165.0" y="160.0" width="120.0" height="34.0" rx="8" class="cell" />
<text x="225.0" y="182.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >switch (kind)</text>
<line x1="225.0" y1="196.0" x2="96.0" y2="236.0" class="arrow" />
<rect x="70.0" y="238.0" width="52.0" height="34.0" rx="8" class="cell" />
<text x="96.0" y="260.0" class="t mono" font-size="13" text-anchor="middle" font-weight="normal" >a+b</text>
<line x1="225.0" y1="196.0" x2="184.0" y2="236.0" class="arrow" />
<rect x="158.0" y="238.0" width="52.0" height="34.0" rx="8" class="cell" />
<text x="184.0" y="260.0" class="t mono" font-size="13" text-anchor="middle" font-weight="normal" >a−b</text>
<line x1="225.0" y1="196.0" x2="272.0" y2="236.0" class="arrow" />
<rect x="246.0" y="238.0" width="52.0" height="34.0" rx="8" class="cell" />
<text x="272.0" y="260.0" class="t mono" font-size="13" text-anchor="middle" font-weight="normal" >a×b</text>
<line x1="225.0" y1="196.0" x2="360.0" y2="236.0" class="arrow" />
<rect x="334.0" y="238.0" width="52.0" height="34.0" rx="8" class="cell" />
<text x="360.0" y="260.0" class="t mono" font-size="13" text-anchor="middle" font-weight="normal" >a÷b</text>
<text x="40.0" y="300.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >En un árbol de miles de nodos el orden de los operadores</text>
<text x="40.0" y="318.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >es impredecible: el procesador falla seguido.</text>
<rect x="450.0" y="86.0" width="410.0" height="270.0" rx="10" class="card" />
<text x="470.0" y="114.0" class="t" font-size="14" text-anchor="start" font-weight="700" >Sin salto (ahora): calcular las 4 y elegir</text>
<rect x="480.0" y="140.0" width="70.0" height="34.0" rx="8" class="cell" />
<text x="515.0" y="162.0" class="t mono" font-size="11.5" text-anchor="middle" font-weight="normal" >r[0]=a+b</text>
<line x1="515.0" y1="176.0" x2="655.0" y2="222.0" class="arrow" />
<rect x="572.0" y="140.0" width="70.0" height="34.0" rx="8" class="cell" />
<text x="607.0" y="162.0" class="t mono" font-size="11.5" text-anchor="middle" font-weight="normal" >r[1]=a−b</text>
<line x1="607.0" y1="176.0" x2="655.0" y2="222.0" class="arrow" />
<rect x="664.0" y="140.0" width="70.0" height="34.0" rx="8" class="cell" />
<text x="699.0" y="162.0" class="t mono" font-size="11.5" text-anchor="middle" font-weight="normal" >r[2]=a×b</text>
<line x1="699.0" y1="176.0" x2="655.0" y2="222.0" class="arrow" />
<rect x="756.0" y="140.0" width="70.0" height="34.0" rx="8" class="cell" />
<text x="791.0" y="162.0" class="t mono" font-size="11.5" text-anchor="middle" font-weight="normal" >r[3]=a÷b</text>
<line x1="791.0" y1="176.0" x2="655.0" y2="222.0" class="arrow" />
<rect x="565.0" y="224.0" width="180.0" height="34.0" rx="8" class="cell" />
<text x="655.0" y="246.0" class="t mono" font-size="12.5" text-anchor="middle" font-weight="normal" >return r[kind − Add]</text>
<text x="470.0" y="300.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >Las mismas operaciones IEEE: resultado idéntico bit a bit.</text>
<text x="470.0" y="318.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >En profundidad 12 la evaluación de B pasa de 5.6 a 2.9 ns</text>
<text x="470.0" y="336.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >por nodo y fila (g++) y a 2.0 ns con clang.</text>
</svg>
