<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Asignador de nodos de B">
<title>Asignador de nodos de B</title>
<style>
text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.bg { fill: #fcfcfb; }
.card { fill: #f4f3ef; stroke: #e2e1dc; }
.t { fill: #0b0b0b; }
.t2 { fill: #52514e; }
.t3 { fill: #7a7974; }
.edge { stroke: #9b9a94; stroke-width: 2; fill: none; }
.edge2 { stroke: #c9c8c2; stroke-width: 2; fill: none; }
.grid { stroke: #e6e5e0; stroke-width: 1; }
.axis { stroke: #b9b8b2; stroke-width: 1; }
.op { fill: #6366f1; } .opt { fill: #ffffff; }
.var { fill: #3fb874; } .vart { fill: #08321b; }
.cst { fill: #d3d4de; } .cstt { fill: #23242a; }
.fold { fill: #f6c445; } .foldt { fill: #3a2a00; }
.s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
.s1s { stroke: #2a78d6; } .s2s { stroke: #eb6834; } .s3s { stroke: #1baf7a; }
.o1 { fill: #86b6ef; } .o2 { fill: #2a78d6; } .o3 { fill: #184f95; }
.ring { fill: none; stroke-width: 3; }
.dash { fill: none; stroke-width: 2; stroke-dasharray: 6 5; }
.hl { fill: #eb6834; fill-opacity: 0.10; stroke: #eb6834; stroke-width: 2; stroke-dasharray: 6 5; }
.hlb { fill: #2a78d6; fill-opacity: 0.08; stroke: #2a78d6; stroke-width: 2; stroke-dasharray: 6 5; }
.good { fill: #0ca30c; } .bad { fill: #d03b3b; }
.goods { stroke: #0ca30c; } .bads { stroke: #d03b3b; }
.cell { fill: #ffffff; stroke: #cfcec8; }
.arrow { stroke: #7a7974; stroke-width: 2; fill: none; marker-end: url(#ah); }
.ah { fill: #7a7974; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; }
  .card { fill: #242423; stroke: #3a3a37; }
  .t { fill: #f0efec; }
  .t2 { fill: #c3c2b7; }
  .t3 { fill: #9d9c95; }
  .edge { stroke: #8f8e88; }
  .edge2 { stroke: #4a4a46; }
  .grid { stroke: #2f2f2d; }
  .axis { stroke: #55554f; }
  .op { fill: #7c7ff5; }
  .var { fill: #2f9e63; } .vart { fill: #ecfff3; }
  .cst { fill: #55565f; } .cstt { fill: #f2f2f6; }
  .fold { fill: #c99a1c; } .foldt { fill: #1d1500; }
  .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
  .s1s { stroke: #3987e5; } .s2s { stroke: #d95926; } .s3s { stroke: #199e70; }
  .o1 { fill: #184f95; } .o2 { fill: #3987e5; } .o3 { fill: #86b6ef; }
  .hl { fill: #d95926; stroke: #d95926; }
  .hlb { fill: #3987e5; stroke: #3987e5; }
  .cell { fill: #20201f; stroke: #45453f; }
  .arrow { stroke: #9d9c95; }
  .ah { fill: #9d9c95; }
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect width="880" height="300" rx="14" class="bg"/>
<text x="28.0" y="38.0" class="t" font-size="19" text-anchor="start" font-weight="700" >B: asignador propio (NodePool) en lugar del heap del sistema</text>
<text x="40.0" y="90.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >bloque de 2 MB = 65,536 casillas de 32 bytes</text>
<rect x="40.0" y="100.0" width="36.0" height="30.0" rx="4" class="s1" />
<rect x="80.0" y="100.0" width="36.0" height="30.0" rx="4" class="s1" />
<rect x="120.0" y="100.0" width="36.0" height="30.0" rx="4" class="s1" />
<rect x="160.0" y="100.0" width="36.0" height="30.0" rx="4" class="s1" />
<rect x="200.0" y="100.0" width="36.0" height="30.0" rx="4" class="s1" />
<rect x="240.0" y="100.0" width="36.0" height="30.0" rx="4" class="s1" />
<rect x="280.0" y="100.0" width="36.0" height="30.0" rx="4" class="s1" />
<rect x="320.0" y="100.0" width="36.0" height="30.0" rx="4" class="s1" />
<rect x="360.0" y="100.0" width="36.0" height="30.0" rx="4" class="s1" />
<rect x="400.0" y="100.0" width="36.0" height="30.0" rx="4" class="cell" />
<rect x="440.0" y="100.0" width="36.0" height="30.0" rx="4" class="cell" />
<rect x="480.0" y="100.0" width="36.0" height="30.0" rx="4" class="cell" />
<rect x="520.0" y="100.0" width="36.0" height="30.0" rx="4" class="cell" />
<rect x="560.0" y="100.0" width="36.0" height="30.0" rx="4" class="cell" />
<rect x="600.0" y="100.0" width="36.0" height="30.0" rx="4" class="cell" />
<rect x="640.0" y="100.0" width="36.0" height="30.0" rx="4" class="cell" />
<text x="404.0" y="152.0" class="t2" font-size="12" text-anchor="start" font-weight="normal" >↑ siguiente casilla libre (next_)</text>
<text x="40.0" y="200.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >Lista libre (LIFO): lo último liberado se reutiliza primero (aún está en cache).</text>
<rect x="40.0" y="214.0" width="90.0" height="30.0" rx="4" class="s2" />
<text x="85.0" y="234.0" class="opt" font-size="12" text-anchor="middle" font-weight="600" >libre</text>
<line x1="132.0" y1="229.0" x2="166.0" y2="229.0" class="arrow" />
<rect x="170.0" y="214.0" width="90.0" height="30.0" rx="4" class="s2" />
<text x="215.0" y="234.0" class="opt" font-size="12" text-anchor="middle" font-weight="600" >libre</text>
<line x1="262.0" y1="229.0" x2="296.0" y2="229.0" class="arrow" />
<rect x="300.0" y="214.0" width="90.0" height="30.0" rx="4" class="s2" />
<text x="345.0" y="234.0" class="opt" font-size="12" text-anchor="middle" font-weight="600" >libre</text>
<text x="40.0" y="280.0" class="t3" font-size="12" text-anchor="start" font-weight="normal" >Pedir un nodo = tomar la cabeza de la lista o avanzar next_. Liberarlo = ponerlo al frente.</text>
</svg>
