<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Una generación del GP completo">
<title>Una generación del GP completo</title>
<style>
text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.bg { fill: #fcfcfb; }
.card { fill: #f4f3ef; stroke: #e2e1dc; }
.t { fill: #0b0b0b; }
.t2 { fill: #52514e; }
.t3 { fill: #7a7974; }
.edge { stroke: #9b9a94; stroke-width: 2; fill: none; }
.edge2 { stroke: #c9c8c2; stroke-width: 2; fill: none; }
.grid { stroke: #e6e5e0; stroke-width: 1; }
.axis { stroke: #b9b8b2; stroke-width: 1; }
.op { fill: #6366f1; } .opt { fill: #ffffff; }
.var { fill: #3fb874; } .vart { fill: #08321b; }
.cst { fill: #d3d4de; } .cstt { fill: #23242a; }
.fold { fill: #f6c445; } .foldt { fill: #3a2a00; }
.s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; }
.s1s { stroke: #2a78d6; } .s2s { stroke: #eb6834; } .s3s { stroke: #1baf7a; }
.o1 { fill: #86b6ef; } .o2 { fill: #2a78d6; } .o3 { fill: #184f95; }
.ring { fill: none; stroke-width: 3; }
.dash { fill: none; stroke-width: 2; stroke-dasharray: 6 5; }
.hl { fill: #eb6834; fill-opacity: 0.10; stroke: #eb6834; stroke-width: 2; stroke-dasharray: 6 5; }
.hlb { fill: #2a78d6; fill-opacity: 0.08; stroke: #2a78d6; stroke-width: 2; stroke-dasharray: 6 5; }
.good { fill: #0ca30c; } .bad { fill: #d03b3b; }
.goods { stroke: #0ca30c; } .bads { stroke: #d03b3b; }
.cell { fill: #ffffff; stroke: #cfcec8; }
.arrow { stroke: #7a7974; stroke-width: 2; fill: none; marker-end: url(#ah); }
.ah { fill: #7a7974; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; }
  .card { fill: #242423; stroke: #3a3a37; }
  .t { fill: #f0efec; }
  .t2 { fill: #c3c2b7; }
  .t3 { fill: #9d9c95; }
  .edge { stroke: #8f8e88; }
  .edge2 { stroke: #4a4a46; }
  .grid { stroke: #2f2f2d; }
  .axis { stroke: #55554f; }
  .op { fill: #7c7ff5; }
  .var { fill: #2f9e63; } .vart { fill: #ecfff3; }
  .cst { fill: #55565f; } .cstt { fill: #f2f2f6; }
  .fold { fill: #c99a1c; } .foldt { fill: #1d1500; }
  .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; }
  .s1s { stroke: #3987e5; } .s2s { stroke: #d95926; } .s3s { stroke: #199e70; }
  .o1 { fill: #184f95; } .o2 { fill: #3987e5; } .o3 { fill: #86b6ef; }
  .hl { fill: #d95926; stroke: #d95926; }
  .hlb { fill: #3987e5; stroke: #3987e5; }
  .cell { fill: #20201f; stroke: #45453f; }
  .arrow { stroke: #9d9c95; }
  .ah { fill: #9d9c95; }
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect width="880" height="360" rx="14" class="bg"/>
<text x="28.0" y="38.0" class="t" font-size="19" text-anchor="start" font-weight="700" >Una generación del GP completo (población N = 5,000)</text>
<rect x="26.0" y="92.0" width="152.0" height="112.0" rx="10" class="card" />
<text x="102.0" y="122.0" class="t" font-size="14" text-anchor="middle" font-weight="700" >Población</text>
<text x="102.0" y="150.0" class="t2" font-size="11.5" text-anchor="middle" font-weight="normal" >N árboles con su MSE</text>
<line x1="180.0" y1="148.0" x2="194.0" y2="148.0" class="arrow" />
<rect x="196.0" y="92.0" width="152.0" height="112.0" rx="10" class="card" />
<text x="272.0" y="122.0" class="t" font-size="14" text-anchor="middle" font-weight="700" >Torneo binario</text>
<text x="272.0" y="150.0" class="t2" font-size="11.5" text-anchor="middle" font-weight="normal" >N veces: 2 al azar,</text>
<text x="272.0" y="168.0" class="t2" font-size="11.5" text-anchor="middle" font-weight="normal" >gana el de menor MSE</text>
<line x1="350.0" y1="148.0" x2="364.0" y2="148.0" class="arrow" />
<rect x="366.0" y="92.0" width="152.0" height="112.0" rx="10" class="card" />
<text x="442.0" y="122.0" class="t" font-size="14" text-anchor="middle" font-weight="700" >Variación 50/50</text>
<text x="442.0" y="150.0" class="t2" font-size="11.5" text-anchor="middle" font-weight="normal" >N/4 cruces → N/2 hijos</text>
<text x="442.0" y="168.0" class="t2" font-size="11.5" text-anchor="middle" font-weight="normal" >N/2 mutaciones → N/2 hijos</text>
<line x1="520.0" y1="148.0" x2="534.0" y2="148.0" class="arrow" />
<rect x="536.0" y="92.0" width="152.0" height="112.0" rx="10" class="card" />
<text x="612.0" y="122.0" class="t" font-size="14" text-anchor="middle" font-weight="700" >Evaluar hijos</text>
<text x="612.0" y="150.0" class="t2" font-size="11.5" text-anchor="middle" font-weight="normal" >MSE de los N hijos</text>
<line x1="690.0" y1="148.0" x2="704.0" y2="148.0" class="arrow" />
<rect x="706.0" y="92.0" width="152.0" height="112.0" rx="10" class="card" />
<text x="782.0" y="122.0" class="t" font-size="14" text-anchor="middle" font-weight="700" >Reemplazo 50/50</text>
<text x="782.0" y="150.0" class="t2" font-size="11.5" text-anchor="middle" font-weight="normal" >mejor 50% de la población</text>
<text x="782.0" y="168.0" class="t2" font-size="11.5" text-anchor="middle" font-weight="normal" >+ mejor 50% de los hijos</text>
<path d="M782.0,208 C782.0,264 102.0,264 102.0,210" class="arrow" />
<text x="440.0" y="278.0" class="t3" font-size="12" text-anchor="middle" font-weight="normal" >se repite G generaciones (el benchmark usa 10)</text>
<text x="26.0" y="318.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >Inicio: 100% grow_full. Elitismo: el mejor de la población está siempre en su mejor 50%, así que el</text>
<text x="26.0" y="337.0" class="t2" font-size="12.5" text-anchor="start" font-weight="normal" >mejor MSE nunca empeora. Orden estable en A, B y C: en un empate gana el que llegó primero.</text>
</svg>
